#:schema node_modules/wrangler/config-schema.json
# Cloudflare Pages deploy config for the Nitro `cloudflare-pages` preset output.
# The build emits `.output/public/` containing static assets plus a
# `_worker.js` bundle that Pages runs at the edge for SSR + server functions.
#
# Pages project name in the Cloudflare dashboard: orzen-commerce-3ea3838d
name = "orzen-commerce-3ea3838d"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Pages-specific: point Pages at the Nitro output folder.
pages_build_output_dir = ".output/public"

# Runtime environment variables. Secrets (CF_API_TOKEN, CF_ZONE_ID,
# CF_ACCOUNT_ID, SUPABASE_SERVICE_ROLE_KEY, LOVABLE_API_KEY, etc.) must be
