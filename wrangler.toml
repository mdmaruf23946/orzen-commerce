#:schema node_modules/wrangler/config-schema.json
# Cloudflare Workers deploy config for the Nitro `cloudflare` preset output.
# The Lovable Vite config builds TanStack Start via Nitro's `cloudflare`
# preset, which emits `.output/server/index.mjs` + `.output/public/*`.
# We deploy that as a single Worker with a static-assets binding.

name = "orzen-commerce"
main = ".output/server/index.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Serve the built public/ directory (Vite output + Nitro public assets)
# straight from Cloudflare's edge; the Worker only runs for non-asset paths.
[assets]
directory = ".output/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Route ALL hostnames pointed at this Worker (root, wildcard subdomains,
# and every customer custom hostname added via SSL for SaaS) to this Worker.
# The apex + wildcard live on the zone you own (orzen.top). Customer domains
# are attached via the SSL-for-SaaS custom hostnames API at runtime and
# don't need to be listed here.
[[routes]]
pattern = "orzen.top/*"
zone_name = "orzen.top"
custom_domain = true

[[routes]]
pattern = "*.orzen.top/*"
zone_name = "orzen.top"

# Runtime environment variables. Secrets (CF_API_TOKEN, CF_ZONE_ID,
# CF_ACCOUNT_ID, SUPABASE_*, LOVABLE_API_KEY, etc.) must be set with
# `wrangler secret put <NAME>` — never commit them here.
