# ---------------------------------------------------------------------------
# BACKUP / FAILOVER DEPLOYMENT
#
#   bash scripts/deploy-cloudflare-backup.sh      (wrangler deploy --env backup)
#
# A second, independent Worker running the exact same code and pointing at the
# exact same Lovable Cloud database — users, products and orders are shared.
# Deploy it in the same account or a completely separate backup account.
# It has no routes either; attach orzen.top to it only when failing over.
# Named environments do NOT inherit [vars] or secrets, so both are repeated
# here and must be pushed once per environment with:
#   bash scripts/cf-push-secrets.sh --env backup
# ---------------------------------------------------------------------------
[env.backup]
name = "orzen-commerce-backup"
workers_dev = true

[env.backup.assets]
directory = ".output/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[env.backup.vars]
