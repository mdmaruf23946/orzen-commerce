#:schema node_modules/wrangler/config-schema.json
# Cloudflare Workers deploy config using Workers Static Assets.
# Nitro builds with the `cloudflare_module` preset, producing:
#   .output/server/index.mjs   ← SSR Worker entry (main)
#   .output/public/            ← static assets served by the [assets] binding
#
# Deploy with:  bunx wrangler deploy
name = "orzen-commerce-3ea3838d"
main = ".output/server/index.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".output/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Route the Worker on the apex + wildcard subdomains once DNS points at CF.
# Comment these out for the first deploy; enable after DNS is proxied.
# [[routes]]
# pattern = "orzen.top"
# custom_domain = true
# [[routes]]
# pattern = "*.orzen.top/*"
# zone_name = "orzen.top"

# Public runtime vars (safe to ship in the client bundle).
# Secrets (CF_API_TOKEN, CF_ZONE_ID, CF_ACCOUNT_ID, SUPABASE_SERVICE_ROLE_KEY,
# LOVABLE_API_KEY) must be pushed with `wrangler secret put` — never commit.
