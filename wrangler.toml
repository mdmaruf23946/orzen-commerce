#:schema node_modules/wrangler/config-schema.json
# Cloudflare Workers deploy config using Workers Static Assets.
# Nitro builds with the `cloudflare_module` preset, producing:
#   .output/server/index.mjs   ← SSR Worker entry (main)
#   .output/public/            ← static assets served by the [assets] binding
#
# Deploy with:  bunx wrangler deploy
name = "orzen-commerce-3ea3838d"
main = ".output/server/index.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".output/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Route the Worker on the apex and www subdomain via custom domains.
# Custom domains do not support wildcard operators or paths, so wildcard
# subdomain hosting (per-store subdomains like <slug>.orzen.top plus the
# shared `stores.orzen.top` fallback used by custom-domain CNAMEs) is
# covered by a standard zone route below.
[[routes]]
pattern = "orzen.top"
custom_domain = true

[[routes]]
pattern = "www.orzen.top"
custom_domain = true

# Wildcard route: every subdomain of orzen.top (store subdomains and
# stores.orzen.top) hits the Worker. Requires the zone to be on
# Cloudflare and a wildcard DNS record (`*.orzen.top` → proxied) to exist.
[[routes]]
pattern = "*.orzen.top/*"
zone_name = "orzen.top"


# Public runtime vars (safe to ship in the client bundle).
# Secrets (CF_API_TOKEN, CF_ZONE_ID, CF_ACCOUNT_ID, SUPABASE_SERVICE_ROLE_KEY,
# LOVABLE_API_KEY) must be pushed with `wrangler secret put` — never commit.
